name: Update data and publish

on:
  schedule:
    - cron: "17 11 * * 1-5"   # 7:17am New York (EDT) on weekdays
    - cron: "47 21 * * 1-5"   # 5:47pm New York (EDT), after the close
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy yfinance
      - run: python pipeline/build.py && python pipeline/make_index.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Commit refreshed data
        run: |
          git config user.name "macro-desk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data.json site/index.html site/build_log.json
          git diff --cached --quiet || git commit -m "Refresh data"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
