name: Update data and publish

on:
  schedule:
    - cron: "17 11 * * 1-5"   # 7:17am New York (EDT) on weekdays
    - cron: "47 21 * * 1-5"   # 5:47pm New York (EDT), after the close
  workflow_dispatch:
    inputs:
      force_slow:
        description: "Refetch IMF, BIS and Comtrade even if cached (1 = yes)"
        required: false
        default: "0"
  push:
    branches: [main]
    paths:
      - site/connections.json
      - site/app.html
      - pipeline/**

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy yfinance
      - run: python pipeline/build.py && python pipeline/make_index.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: World and trade data
        run: python pipeline/world.py
        continue-on-error: true
        timeout-minutes: 20
        env:
          FORCE_SLOW: ${{ github.event.inputs.force_slow }}
          COMTRADE_BUDGET_S: "900"
      - name: Commit refreshed data
        run: |
          git config user.name "macro-desk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data.json site/index.html site/build_log.json
          for f in site/world.json site/trade.json site/world_log.json; do [ -f "$f" ] && git add "$f"; done; true
          git diff --cached --quiet || git commit -m "Refresh data"
          git pull --rebase || true
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
